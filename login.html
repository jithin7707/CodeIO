<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-200 dark:bg-gray-900 flex items-center justify-center">

    <div class="bg-cyan-900 m-5 w-90 " >
      <div class="m-2 p-2 text-center text-white">Login</div>
      <form action="index.html">
        <div>
          <label for="email"  class="m-2 p-2 text-center text-white">Email : </label>
          <input
            type="email"
            name="email"
            id="email"
            class="border rounded p-1 text-white bg-gray-900 m-2 mx-10"
          />
        </div>
        <div>
          <label for="password"  class="m-2 p-2 text-center text-white">PassWord :</label>
          <input
            type="password"
            name="password"
            id="password"
            class="border rounded p-1 text-white bg-gray-900 m-2 mx-2"
          />
        </div>
        <button class="bg-gray-900 p-2 m-2 w-86 rounded text-white">Login</button>
      </form>
    </div>
  </body>
</html>
